- name: Set CNI variables
  ansible.builtin.set_fact:
    cni_version: "v1.9.0"
    cni_arch: "{{ 'amd64' if ansible_architecture in ['x86_64'] else ansible_architecture }}"
    cni_os: "linux"

- name: Ensure /opt/cni/bin exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Download CNI plugins archive
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_version }}/cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz"
    dest: "/tmp/cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz"
    mode: "0644"
  register: cni_download

- name: Download CNI checksum
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_version }}/cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz.sha256"
    dest: "/tmp/cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz.sha256"
    mode: "0644"

- name: Verify CNI archive checksum
  ansible.builtin.shell: |
    cd /tmp
    sha256sum -c cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz.sha256
  register: cni_checksum
  changed_when: false
  failed_when: "'OK' not in cni_checksum.stdout"

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins-{{ cni_os }}-{{ cni_arch }}-{{ cni_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true
  when: cni_download.changed
